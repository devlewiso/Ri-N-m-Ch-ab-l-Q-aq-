        // --- LÓGICA DE AUDIO ---

        // Función para inicializar y empezar la música
        async function startMusic() {
            // Tone.js requiere que se inicie el contexto de audio después de una interacción del usuario
            await Tone.start();
            
            // Si la música ya se inició, solo reanudar
            if (musicStarted) {
                Tone.getTransport().start();
                musicToggleButton.textContent = "⏸️ Chaq'atäj B'ix";
                return;
            }

            // Inicializar el sintetizador (para un sonido alegre)
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: {
                    attack: 0.05,
                    decay: 0.1,
                    sustain: 0.3,
                    release: 1
                }
            }).toDestination();
            
            // Aplicar el volumen inicial del slider
            synth.volume.value = volumeSlider.value; 

            // Melodía simple y alegre (escala mayor)
            const notes = ["C4", "E4", "G4", "A4", "G4", "E4", "C4", "G3"];
            let noteIndex = 0;

            // Crear el loop de repetición
            loop = new Tone.Loop(time => {
                const note = notes[noteIndex % notes.length];
                synth.triggerAttackRelease(note, "8n", time);
                noteIndex++;
            }, "4n").start(0);

            // Iniciar el transporte (el "reloj" de la música)
            Tone.getTransport().bpm.value = 120; // Ritmo
            Tone.getTransport().start();

            musicStarted = true;
            musicToggleButton.textContent = "⏸️ Chaq'atäj B'ix"; // Pausar Música
        }
        
        // Función para pausar la música
        function stopMusic() {
            if (musicStarted) {
                Tone.getTransport().pause();
                musicToggleButton.textContent = "▶️ Tikirisaj B'ix"; // Reanudar Música
            }
        }

        // Event listener para el botón de Play/Pause
        musicToggleButton.addEventListener('click', () => {
            if (!musicStarted || Tone.getTransport().state === 'stopped' || Tone.getTransport().state === 'paused') {
                startMusic();
            } else {
                stopMusic();
            }
        });
        
        // Event listener para el control de volumen
        volumeSlider.addEventListener('input', (event) => {
            // El valor del slider es en decibelios (dB), Tone.js lo usa directamente
            if (synth) {
                synth.volume.value = event.target.value;
            }
        });

            updateIngredientIndicators();
            // Mensaje de acción en K'iche'
            messageBox.textContent = `¡Xaya ${ingredientName}! ¡Q'axawa'! (¡Añadiste ${ingredientName}! ¡Sigue así!)`;
            messageBox.style.color = '#4CAF50'; // Verde

            // 2. Comprobar si se completó el desafío
            const currentChallenge = CHALLENGES[currentChallengeIndex];
            if (collectedIngredients.length === currentChallenge.ingredients.length) {
                // Desafío completado, mostrar el éxito y preparar el botón Siguiente
                showSuccess(currentChallenge);
                visualOutput.classList.add('success-animation');
            }
        }

        /**
         * Muestra el resultado de éxito y prepara el botón para avanzar.
         */
        function showSuccess(challenge) {
            visualOutput.textContent = challenge.emoji;
            messageBox.textContent = challenge.success; // Mensaje de éxito traducido
            messageBox.style.color = '#4A148C'; // Morado
            instructionText.textContent = `¡Xab'anataj ri tzij: ${challenge.category}! (¡Completaste la categoría!)`;

            // Ocultar botones de ingredientes y mostrar botón Siguiente
            gameControls.innerHTML = ''; 

            const nextButton = document.createElement('button');
            
            // Verificar si es el último desafío
            const isLastChallenge = currentChallengeIndex === TOTAL_CHALLENGES - 1;

            nextButton.textContent = isLastChallenge
                                     ? "¡Chajäl Q'ij! 🚀" // Volver a Empezar
                                     : "¡Chuk'u'maj Xa'an! 👉"; // Siguiente Desafío
            nextButton.className = 'action-button';
            nextButton.style.backgroundColor = isLastChallenge ? '#f44336' : '#00C853';
            nextButton.addEventListener('click', handleNextChallenge);
            gameControls.appendChild(nextButton);
        }

        /**
         * Maneja el avance al siguiente desafío o reinicio.
         */
        function handleNextChallenge() {
            visualOutput.classList.remove('success-animation');
            collectedIngredients = []; // Resetear ingredientes

            if (currentChallengeIndex < TOTAL_CHALLENGES - 1) {
                currentChallengeIndex++; // Avanzar
            } else {
                currentChallengeIndex = 0; // Reiniciar
            }

            updateGameView();
        }


        /**
         * Crea y actualiza los indicadores visuales de los ingredientes requeridos.
         */
        function updateIngredientIndicators() {
            const currentChallenge = CHALLENGES[currentChallengeIndex];
            indicatorContainer.innerHTML = '';

            currentChallenge.ingredients.forEach(ing => {
                const indicator = document.createElement('span');
                indicator.textContent = ing.emoji;
                indicator.className = 'indicator';
                
                // Si el ingrediente está recolectado, hacerlo visible
                if (collectedIngredients.includes(ing.name)) {
                    indicator.classList.add('collected');
                }
                indicatorContainer.appendChild(indicator);
            });
        }


        /**
         * Actualiza la interfaz del juego (visuales, texto y botones).
         */
        function updateGameView() {
            const currentChallenge = CHALLENGES[currentChallengeIndex];
            
            // 0. Actualizar el indicador de progreso en K'iche'
            progressIndicator.textContent = `Chuk'u'maj ${currentChallengeIndex + 1} rech ${TOTAL_CHALLENGES}`;

            // 1. Mostrar información del desafío actual
            goalText.textContent = `Chuk'u'maj: ${currentChallenge.goal} (${currentChallenge.category})`;
            // Instrucción principal traducida
            instructionText.textContent = `¡Chakoj ri 3 tiko'n rech b'anöl ${currentChallenge.goal.split(' ')[0]}! (¡Busca los 3 ingredientes para crear un(a) ${currentChallenge.goal.split(' ')[0]}!)`;
            visualOutput.textContent = currentChallenge.emoji;
            visualOutput.style.transform = 'scale(1)';
            messageBox.textContent = '';

            // 2. Crear los botones de acción (ingredientes)
            gameControls.innerHTML = '';
            currentChallenge.ingredients.forEach(ing => {
                const button = document.createElement('button');
                // Mostrar el nombre del ingrediente en K'iche'
                button.textContent = `${ing.emoji} ${ing.name}`; 
                button.className = 'action-button';
                button.style.backgroundColor = ing.color;
                
                // Deshabilitar si ya está recolectado
                if (collectedIngredients.includes(ing.name)) {
                    button.disabled = true;
                } else {
                    // Usar bind para pasar el nombre del ingrediente al hacer click
                    button.addEventListener('click', () => handleActionClick(ing.name));
                }
                gameControls.appendChild(button);
            });

            // 3. Actualizar los indicadores
            updateIngredientIndicators();
        }

        // Inicializar el juego al cargar la ventana
        window.onload = updateGameView;

    </script>
</body>
</html>
